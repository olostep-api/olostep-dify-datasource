identity:
  author: olostep
  name: olostep_datasource
  label:
    en_US: Olostep
  description:
    en_US: Crawl any website into your Knowledge Base with clean, LLM-ready markdown.
  icon: icon.png
provider_type: website_crawl
credentials_schema:
  - name: api_key
    type: secret-input
    required: true
    label:
      en_US: Olostep API key
    placeholder:
      en_US: Enter your Olostep API key
    help:
      en_US: Get your API key from the Olostep dashboard.
    url: https://www.olostep.com/dashboard
datasources:
  - datasources/crawl.yaml
extra:
  python:
    source: provider/olostep_datasource.py
